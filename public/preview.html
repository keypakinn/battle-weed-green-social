<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>การ์ดทั้งหมด — Battle Weed</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&display=swap">
<link rel="stylesheet" href="/card.css">
<style>
body{margin:0;padding:16px;background:#16301F;color:#E7F0E8;font-family:Mitr,sans-serif}
h1{font-size:20px} .thumbs{display:flex;gap:8px;flex-wrap:wrap} .thumbs .ck-card{width:110px}
.full{display:flex;flex-wrap:wrap;gap:16px} #sum{font-size:14px;margin:8px 0}
</style>
</head>
<body class="ck-preview">
<h1>การ์ดทั้งหมด</h1>
<div id="sum"></div>
<h2>แบบย่อ</h2><div class="thumbs" id="t"></div>
<h2>แบบเต็มใบ</h2><div class="full" id="f"></div>
<script src="/card.js"></script>
<script>
CardKit.load().then(cards => {
  cards.forEach(c => { f.appendChild(CardKit.render(c, { mode: 'full' })); t.appendChild(CardKit.render(c, { mode: 'thumb' })); });
  setTimeout(() => { sum.textContent = cards.length + ' ใบ · ข้อความล้นช่อง ' + document.querySelectorAll('[data-overflow]').length + ' จุด'; }, 1500);
}).catch(e => { sum.textContent = 'โหลดการ์ดไม่ได้: ' + e.message; });
</script>
</body>
</html>
